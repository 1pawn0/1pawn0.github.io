site_name: My Docs Archive
site_url: https://1pawn0.github.io/
site_description: My Personal Documents Archive

theme:
  name: material
  language: en
  direction: ltr
  favicon: img/favicon.svg
  features:
    - search.highlight
    - search.suggest
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow

  font:
    text: Red Hat Text
    code: Red Hat Mono

  icon:
    logo: fontawesome/solid/book-open

  palette:

    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference


plugins:
  - tags
  - search
  - privacy
  - meta


validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false
  homepage: https://1pawn0.github.io/

strict: true

draft_docs: |
  drafts/               # A "drafts" directory anywhere.
  _unpublished.md       # A md file ending in _unpublished.md
  markdowns/drafts/
  docs/markdowns/drafts/
  _draft.md
  

