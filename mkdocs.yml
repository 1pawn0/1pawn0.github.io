site_name: My Docs Archive
site_url: https://1pawn0.github.io/
site_description: My Personal Documents Archive

theme:
  name: material
  language: en
  direction: ltr
  favicon: img/favicon.svg
  features:
    - search.highlight
    - search.suggest
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow

  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono

  icon:
    logo: fontawesome/solid/book-open

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - tags
  - search
  - privacy
  - meta
  - optimize
  - privacy

  - blog:
      enabled: false
      draft: false
      draft_on_serve: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false

extra_javascript:
  - javascripts/extra.js

extra_css:
  - stylesheets/extra.css

strict: true

draft_docs: |
  drafts/
  draft/
  markdowns/drafts/
  docs/markdowns/drafts/
  *draft/
  *drafts/
  *_draft.md
  *-draft.md
  *draft.md
  *unpublished.md

